name: Build Tasbih APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: gradle assembleRelease

      - name: Show generated APK
        run: |
          echo "APK files generated:"
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Rename APK
        run: |
          APK=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          cp "$APK" Tasbih.apk
          echo "Created Tasbih.apk from $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tasbih-APK
          path: Tasbih.apk
          if-no-files-found: error
