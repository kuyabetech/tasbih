name: Build Tasbih APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: gradle assembleRelease

      - name: Create signing key
        run: |
          keytool -genkeypair \
            -v \
            -keystore tasbih-release.keystore \
            -alias tasbih \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Tasbih, OU=Tasbih, O=Tasbih, L=Lagos, ST=Lagos, C=NG"

      - name: Sign APK
        run: |
          APK=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          apksigner sign \
            --ks tasbih-release.keystore \
            --ks-key-alias tasbih \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out Tasbih.apk \
            "$APK"

      - name: Verify APK
        run: |
          apksigner verify --verbose Tasbih.apk

      - name: Show APK
        run: |
          ls -lh Tasbih.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tasbih-APK
          path: Tasbih.apk
          if-no-files-found: error
